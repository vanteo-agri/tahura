<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Quy đổi liều pha ghi trên nhãn sản phẩm sang bình phun 25 lít.">
  <title>Tính lượng thuốc | TAHURA</title>
  <link rel="stylesheet" href="styles.css?v=ruong-dua-ro-net">
  <style>
    .about-header{height:auto;min-height:78px;gap:8px}
    .about-home{font-weight:600;padding:12px 0}
    .about-banner{background:var(--green);color:white;padding:52px 6%}
    .about-banner h1{max-width:960px;font-size:clamp(32px,5vw,56px);letter-spacing:-.035em;margin:0}
    #spray-unit {
      color: #0f3d19;
      background: #fdfefd;
      border: 2px solid #b8d4ba;
      border-radius: 8px;
      font-size: 16px;
      min-height: 48px;
    }
    #spray-unit option { color: #0f3d19; background: #fff; }
    .spray-banner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      align-items: center;
      gap: 16px;
      padding-block: 16px;
    }
    .spray-banner-products {
      position: relative;
      width: 100%;
      max-width: 190px;
      aspect-ratio: 900 / 795;
      overflow: hidden;
      border-radius: 12px;
      justify-self: end;
    }
    .spray-banner-products img {
      position: absolute;
      /* Cắt bớt nền quanh ba chai, theo khung 900 × 795 của ảnh gốc. */
      inset: -6.92% auto auto -16.67%;
      display: block;
      width: 133.33%;
      max-width: none;
      height: auto;
    }
    @media (max-width: 700px) {
      .spray-banner {
        grid-template-columns: minmax(0, 1fr) clamp(88px, 28vw, 150px);
        gap: 12px;
        padding-block: 12px;
      }
      .spray-banner h1 { font-size: clamp(23px, 5.2vw, 36px); line-height: 1.15; }
    }
  </style>
  <link rel="stylesheet" href="budget.css">
</head>
<body>
  <header class="about-header">
    <a class="logo-window" href="./" aria-label="TAHURA trang chủ"><img src="assets/tahura-logo.png" alt="TAHURA"></a>
    <a class="about-home" href="./">← Trang chủ</a>
  </header>
  <main>
    <div class="about-banner spray-banner">
      <h1 id="spray-title">Tính lượng thuốc</h1>
      <div class="spray-banner-products">
        <img src="assets/tinh-luong-thuoc-bo-san-pham.jpg" width="1000" height="747" alt="Ba chai Dưỡng Chất Xanh, Terramin Seaweed và Terron A2" decoding="async">
      </div>
    </div>
    <section class="tahura-calc-section" aria-labelledby="spray-title">
      <p class="tahura-calc-desc">Nhập liều pha và lượng nước tương ứng theo nhãn sản phẩm. Dùng công cụ cho liều ghi theo thể tích nước, rồi pha và sử dụng theo hướng dẫn trên nhãn.</p>
      <form id="spray-form">
        <div class="calc-controls">
          <div class="control-group">
            <label for="spray-dose">Liều ghi trên nhãn</label>
            <div class="input-wrap"><input id="spray-dose" name="dose" type="number" inputmode="decimal" min="0" step="any" required></div>
          </div>
          <div class="control-group">
            <label for="spray-unit">Đơn vị của liều</label>
            <select id="spray-unit" name="unit">
              <option value="ml">Mililít (ml)</option>
              <option value="g">Gam (g)</option>
              <option value="lít">Lít (L)</option>
            </select>
          </div>
          <div class="control-group">
            <label for="spray-water">Lượng nước ghi trên nhãn (lít)</label>
            <div class="input-wrap"><input id="spray-water" name="water" type="text" placeholder="Ví dụ: 500 - 600" aria-describedby="spray-water-hint" required></div>
            <small id="spray-water-hint">Nhập một số hoặc một khoảng, ví dụ 500 hoặc 500 - 600.</small>
          </div>
        </div>
        <button class="button" type="submit">Tính liều cho 25 lít</button>
        <p id="spray-result" role="status"></p>
      </form>
    </section>
  </main>
  <script>
    const form = document.querySelector('#spray-form');
    const result = document.querySelector('#spray-result');
    const formatDose = new Intl.NumberFormat('vi-VN', { maximumSignificantDigits: 8 });
    const formatMl = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 2 });
    const waterPattern = /^(\d+(?:[.,]\d+)?)(?:\s*[-–—]\s*(\d+(?:[.,]\d+)?))?$/;

    form.addEventListener('input', () => { result.textContent = ''; });
    form.elements.unit.addEventListener('change', () => { result.textContent = ''; });
    form.addEventListener('submit', event => {
      event.preventDefault();
      const dose = form.elements.dose.valueAsNumber;
      const waterInput = form.elements.water.value.trim();
      const match = waterInput.match(waterPattern);
      const minimum = Number(match?.[1]?.replace(',', '.'));
      const maximum = Number((match?.[2] ?? match?.[1])?.replace(',', '.'));

      if (!Number.isFinite(dose) || dose <= 0) {
        result.textContent = 'Hãy nhập liều lớn hơn 0.';
        return;
      }
      if (!Number.isFinite(minimum) || !Number.isFinite(maximum) || minimum <= 0 || maximum < minimum) {
        result.textContent = 'Hãy nhập lượng nước lớn hơn 0, ví dụ 500 hoặc 500 - 600 (số nhỏ trước).';
        return;
      }

      const inputUnit = form.elements.unit.value;
      const outputUnit = inputUnit === 'g' ? 'g' : 'ml';
      const conversion = inputUnit === 'lít' ? 1000 : 1;
      const low = (dose / maximum) * 25 * conversion;
      const high = (dose / minimum) * 25 * conversion;
      if (!Number.isFinite(high) || low <= 0) {
        result.textContent = 'Giá trị nằm ngoài phạm vi tính toán.';
        return;
      }

      const format = value => outputUnit === 'ml' && value >= 0.01
        ? formatMl.format(value)
        : formatDose.format(value);
      const lower = format(low);
      const upper = format(high);
      const amount = lower === upper ? upper : lower + '–' + upper;
      result.textContent = amount + ' ' + outputUnit + ' cho 25 lít nước.';
    });
  </script>
</body>
</html>
